name: autofix.ci  # needed to securely identify the workflow

on:
  push:
    branches:
      - base
      - locale
  pull_request:

permissions:
  contents: read

jobs:
  docit:
    uses: ./.github/workflows/cache-docit.yml

  autofix:
    runs-on: ubuntu-latest
    needs: docit
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just, sd, fd-find, typstyle
      - run: just setup
      - name: Setup docit
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.docit.outputs.key }}
          path: target/typst-docs
          fail-on-cache-miss: true

      - run: just fmt
      - run: just save-patches

      - uses: Swatinem/rust-cache@v2
        if: ${{ github.base_ref == 'base' || github.ref_name == 'base' }}
        with:
          workspaces: scripts/babelize/
      - name: Update locale/
        if: ${{ github.base_ref == 'base' || github.ref_name == 'base' }}
        run: |
          rustup target add wasm32-unknown-unknown
          rm -r locale/
          just export-i18n
          mv target/i18n-export/ locale/

      - uses: autofix-ci/action@c5b2d67aa2274e7b5a18224e8171550871fc7e4a
