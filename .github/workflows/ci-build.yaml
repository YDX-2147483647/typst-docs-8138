name: Build for deployments
on:
  push:
    branches:
      - base
      - locale
  pull_request:
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  docit:
    uses: ./.github/workflows/cache-docit.yml

  build:
    runs-on: ubuntu-latest
    needs: docit
    name: Build for ${{ matrix.profile }}
    strategy:
      matrix:
        include:
          - profile: github-pages
            base: "" # The base will be inferred from context to support forks
          - profile: cloudflare
            base: /
    steps:
      - uses: actions/checkout@v7
      - uses: taiki-e/install-action@v2
        with:
          tool: just
      - name: Install pagefind and pdfcpu
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p ~/.local/bin/

          curl -L https://github.com/Pagefind/pagefind/releases/download/${PAGEFIND_VERSION}/pagefind_extended-${PAGEFIND_VERSION}-x86_64-unknown-linux-musl.tar.gz | tar -xz
          chmod u+x pagefind_extended
          mv pagefind_extended ~/.local/bin/

          curl -L https://github.com/pdfcpu/pdfcpu/releases/download/${PDFCPU_VERSION}/pdfcpu_${PDFCPU_VERSION#v}_Linux_x86_64.tar.xz | tar -xJ
          mv pdfcpu_${PDFCPU_VERSION#v}_Linux_x86_64/pdfcpu ~/.local/bin/
          chmod u+x ~/.local/bin/pdfcpu
          rm -r pdfcpu_${PDFCPU_VERSION#v}_Linux_x86_64

          pagefind_extended --version
          pdfcpu version
        env:
          PAGEFIND_VERSION: v1.5.2
          PDFCPU_VERSION: v0.15.0

      - run: just setup
      - name: Setup docit
        uses: actions/cache/restore@v6
        with:
          key: ${{ needs.docit.outputs.key }}
          path: target/typst-docs
          fail-on-cache-miss: true

      - run: just ci-build "${{ matrix.base || '/${GITHUB_REPOSITORY#*/}/' }}"
        
      - if: matrix.profile == 'github-pages'
        uses: actions/upload-pages-artifact@v5
        with:
          path: target/dist/
      - if: matrix.profile != 'github-pages'
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ matrix.profile }}
          path: target/dist/

  deploy:
    name: Deploy to GitHub Pages
    # Run only for the default `locale` branch, not in the `base` branch or pull requests
    if: github.ref_name == 'locale'
    needs: build
    runs-on: ubuntu-latest

    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write # to deploy to Pages
      id-token: write # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  deploy-cloudflare:
    name: Deploy to Cloudflare
    # Run only in the main repo, not in forks
    if: github.repository == 'typst-doc-cn/docs-8138'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-cloudflare
          path: target/dist/
      - uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.136.3"
          command: >-
            pages deploy
            ./target/dist/
            --project-name=docs-8138
            --branch=${{ github.head_ref || github.ref_name }}
            --commit-hash=${{ github.sha }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
